plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
}

def targetMc = findProperty("mc") ?: "1.20.1"
def versionFile = file("versions/${targetMc}.properties")
if (versionFile.exists()) {
    def props = new Properties()
    versionFile.withInputStream { props.load(it) }
    props.each { key, val ->
        project.ext.set(key.toString(), val.toString())
    }
}

subprojects {
    apply plugin: 'java'

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    repositories {
        mavenCentral()
        maven { url = "https://maven.isxander.dev/releases" }
        maven { url = "https://maven.terraformersmc.com/" }
    }
}
