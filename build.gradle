plugins {
    id 'java'
    id 'fabric-loom' version '1.17.21' apply false
    id 'net.neoforged.moddev' version "${neoforge_moddev_version}" apply false
}

def targetMc = findProperty("mc") ?: "1.21.1"
def versionFile = file("versions/${targetMc}.properties")
if (versionFile.exists()) {
    def props = new Properties()
    versionFile.withInputStream { props.load(it) }
    props.each { key, val ->
        project.ext.set(key.toString(), val.toString())
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.isxander.dev/releases' }
        maven { url = 'https://maven.terraformersmc.com/releases' }
        maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
}

subprojects {
    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    processResources {
        def expandProps = [
                'version'                  : project.version,
                'mod_version'              : rootProject.mod_version,
                'minecraft_version'        : rootProject.minecraft_version,
                'minecraft_dependency'     : rootProject.findProperty('minecraft_dependency') ?: '>=1.21 <=1.21.11',
                'minecraft_version_range'  : rootProject.findProperty('minecraft_version_range') ?: '[1.21, 1.22)',
                'neoforge_version_range'   : rootProject.findProperty('neoforge_version_range') ?: '[21.0, 22.0)',
                'loader_version'           : rootProject.loader_version
        ]
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
            expand expandProps
        }
    }
}

tasks.register('buildAll') {
    description = 'Builds the unified Fabric and NeoForge jars for Minecraft 1.21.x'
    group = 'build'
    dependsOn ':fabric:build', ':neoforge:build'
}

tasks.register('smokeTest') {
    description = 'Automated client smoke test: boots each version, confirms clean initialization & audio engine, then shuts down.'
    group = 'verification'
    dependsOn 'buildAll'

    doLast {
        def versionsToTest = ['1.21.1', '1.21.4', '1.21.11']
        println "\n=============================================="
        println "  RUNNING AUTOMATED CLIENT SMOKE TESTS"
        println "=============================================="

        versionsToTest.each { mcVer ->
            println "\n>>> Testing Minecraft ${mcVer} (Fabric)..."
            long startTime = System.currentTimeMillis()

            def cmd = ['./gradlew', ':fabric:runClient', "-Pmc=${mcVer}".toString(), '--no-daemon'] as String[]
            def pb = new ProcessBuilder(cmd)
            pb.directory(project.rootDir)
            pb.environment().put("JAVA_HOME", System.getProperty("java.home"))
            pb.redirectErrorStream(true)

            def proc = pb.start()
            def reader = new BufferedReader(new InputStreamReader(proc.inputStream))

            boolean passed = false
            String failureReason = null
            String line

            while ((line = reader.readLine()) != null) {
                if (line.contains("MixinApplyError") ||
                    line.contains("Incompatible mod set") ||
                    line.contains("NoSuchMethodError") ||
                    line.contains("ClassNotFoundException") ||
                    line.contains("Exception in thread \"main\"")) {
                    failureReason = line
                    break
                }
                if (line.contains("Sound engine started") || line.contains("OpenAL initialized")) {
                    passed = true
                    break
                }
            }

            if (!passed && failureReason == null) {
                failureReason = "Process terminated before reaching title screen."
            }

            proc.toHandle().descendants().forEach { h -> h.destroyForcibly() }
            proc.destroyForcibly()
            proc.waitFor()

            long elapsed = (System.currentTimeMillis() - startTime) / 1000
            if (passed) {
                println "✔ [PASSED] Minecraft ${mcVer} loaded cleanly in ${elapsed}s (Mixins applied, mod loaded, title screen reached)!"
            } else {
                throw new GradleException("✘ [FAILED] Minecraft ${mcVer} smoke test failed: ${failureReason}")
            }
        }

        println "\n=============================================="
        println "  ALL VERSIONS PASSED SMOKE TESTS SUCCESSFULLY"
        println "==============================================\n"
    }
}
