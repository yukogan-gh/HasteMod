plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version "${neoforge_moddev_version}" apply false
}

subprojects {
    apply plugin: 'java'

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    repositories {
        mavenCentral()
        maven { url = "https://maven.isxander.dev/releases" }
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.neoforged.net/releases" }
    }
}

tasks.register('build26_1', Exec) {
    description = 'Builds Fabric and NeoForge jars for Minecraft 26.1'
    group = 'build'
    commandLine './gradlew', 'build',
        '-Pminecraft_version=26.1',
        '-Pfabric_api_version=0.144.4+26.1',
        '-Pneoforge_version=26.1.2.109',
        '-Pyacl_version=3.9.6+26.1-fabric',
        '-Pyacl_neoforge_version=3.9.6+26.1-neoforge',
        '-Pmod_version=0.3.0-26.1'
}

tasks.register('build26_2', Exec) {
    description = 'Builds Fabric and NeoForge jars for Minecraft 26.2'
    group = 'build'
    commandLine './gradlew', 'build',
        '-Pminecraft_version=26.2',
        '-Pfabric_api_version=0.158.0+26.2',
        '-Pneoforge_version=26.2.0.88',
        '-Pyacl_version=3.9.6+26.2-fabric',
        '-Pyacl_neoforge_version=3.9.6+26.2-neoforge',
        '-Pmod_version=0.3.0-26.2'
}

tasks.register('build26_3', Exec) {
    description = 'Builds Fabric and NeoForge jars for Minecraft 26.3'
    group = 'build'
    commandLine './gradlew', 'build',
        '-Pminecraft_version=26.3',
        '-Pfabric_api_version=0.161.0+26.3',
        '-Pneoforge_version=26.3.0.7-beta',
        '-Pyacl_version=3.9.7+26.3-fabric',
        '-Pyacl_neoforge_version=3.9.7+26.3-neoforge',
        '-Pmod_version=0.3.0-26.3'
}

tasks.register('buildAll') {
    description = 'Builds Fabric and NeoForge jars for all supported 26.x versions (26.1, 26.2, 26.3)'
    group = 'build'
    dependsOn 'build26_1', 'build26_2', 'build26_3'
}
