plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version "${neoforge_moddev_version}" apply false
}

def targetMc = findProperty("mc") ?: "26.1"
def versionFile = file("versions/${targetMc}.properties")
if (versionFile.exists()) {
    def props = new Properties()
    versionFile.withInputStream { props.load(it) }
    props.each { key, val ->
        project.ext.set(key.toString(), val.toString())
    }
}

allprojects {
    layout.buildDirectory = file("build-${targetMc}")
    if (versionFile.exists()) {
        def props = new Properties()
        versionFile.withInputStream { props.load(it) }
        props.each { key, val ->
            project.ext.set(key.toString(), val.toString())
        }
    }
}

subprojects {
    apply plugin: 'java'

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    tasks.withType(Test).configureEach {
        failOnNoDiscoveredTests = false
    }

    repositories {
        mavenCentral()
        maven { url = "https://maven.isxander.dev/releases" }
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.neoforged.net/releases" }
    }
}

def runGameTestMatrix = { List<Map<String, String>> targets, int concurrency = 2 ->
    println "\n============================================================"
    println "             RUNNING GAMETEST SUITE MATRIX"
    println "  Targets: ${targets.collect { "${it.loader}:${it.mc}" }.join(', ')}"
    println "  Concurrency: ${concurrency} in parallel"
    println "============================================================"

    def executor = java.util.concurrent.Executors.newFixedThreadPool(concurrency)
    def failures = new java.util.concurrent.CopyOnWriteArrayList<String>()

    def tasks = targets.collect { target ->
        def loader = target.loader
        def mcVer = target.mc
        def tag = "${loader.capitalize()} ${mcVer}"
        return {
            println "\n[${tag}] >>> Starting GameTest on Minecraft ${mcVer} (${loader})..."
            long startTime = System.currentTimeMillis()

            def cmd = ['./gradlew', ":${loader}:runClientGameTest".toString(), "-Pmc=${mcVer}".toString(), '--project-cache-dir', ".gradle-${loader}-${mcVer}".toString(), '--no-daemon'] as String[]
            def pb = new ProcessBuilder(cmd)
            pb.directory(project.rootDir)
            pb.redirectErrorStream(true)

            def proc = pb.start()
            def reader = new BufferedReader(new InputStreamReader(proc.inputStream))
            def outputLines = new java.util.concurrent.ConcurrentLinkedQueue<String>()

            boolean passed = false
            String failureReason = null
            String line

            while ((line = reader.readLine()) != null) {
                outputLines.add(line)
                if (outputLines.size() > 40) {
                    outputLines.poll()
                }
                if (line.contains("[GameTest]")) {
                    println "   [${tag}] ${line.substring(line.indexOf('[GameTest]'))}"
                }
                if (line.contains("SUCCESS:") || line.contains("PASSED") || line.contains("ALL TESTS PASSED") || line.contains("ALL HASTEMOD GAMETESTS PASSED")) {
                    passed = true
                }
                if (line.contains("AssertionError:") || line.contains("BUILD FAILED") || line.contains("Execution failed")) {
                    failureReason = line
                }
            }

            proc.waitFor()

            long elapsed = (System.currentTimeMillis() - startTime) / 1000
            if (passed && proc.exitValue() == 0) {
                println "✔ [PASSED] [${tag}] Minecraft ${mcVer} (${loader}) GameTest passed in ${elapsed}s!"
            } else {
                def err = "✘ [FAILED] [${tag}] Minecraft ${mcVer} (${loader}) GameTest failed (${failureReason ?: 'exit code ' + proc.exitValue()})"
                println err
                if (!passed) {
                    println "--- [${tag}] Last console lines ---"
                    outputLines.each { println "   [${tag}] ${it}" }
                }
                failures.add(err)
            }
        } as java.util.concurrent.Callable<Void>
    }

    try {
        executor.invokeAll(tasks)
    } finally {
        executor.shutdown()
    }

    if (!failures.isEmpty()) {
        throw new GradleException("GameTest failures occurred:\n" + failures.join("\n"))
    }

    println "\n============================================================"
    println "       ALL GAMETESTS IN MATRIX PASSED SUCCESSFULLY"
    println "============================================================\n"
}

tasks.register('gameTestFabricAll') {
    description = 'GameTest Fabric across all Minecraft versions (26.1, 26.2, 26.3)'
    group = 'verification'
    doLast {
        def targets = ['26.1', '26.2', '26.3'].collect { [loader: 'fabric', mc: it] }
        int concurrency = project.findProperty("parallel") ? Integer.parseInt(project.property("parallel").toString()) : 2
        runGameTestMatrix(targets, concurrency)
    }
}

tasks.register('gameTestNeoForgeAll') {
    description = 'GameTest NeoForge across all Minecraft versions (26.1, 26.2, 26.3)'
    group = 'verification'
    doLast {
        def targets = ['26.1', '26.2', '26.3'].collect { [loader: 'neoforge', mc: it] }
        int concurrency = project.findProperty("parallel") ? Integer.parseInt(project.property("parallel").toString()) : 2
        runGameTestMatrix(targets, concurrency)
    }
}

tasks.register('gameTestAll') {
    description = 'GameTest across all Minecraft versions and loaders (Fabric & NeoForge)'
    group = 'verification'
    doLast {
        def targets = []
        ['26.1', '26.2', '26.3'].each { mc -> targets.add([loader: 'fabric', mc: mc]) }
        ['26.1', '26.2', '26.3'].each { mc -> targets.add([loader: 'neoforge', mc: mc]) }
        int concurrency = project.findProperty("parallel") ? Integer.parseInt(project.property("parallel").toString()) : 2
        runGameTestMatrix(targets, concurrency)
    }
}

tasks.register('build26_1', Exec) {
    description = 'Builds Fabric and NeoForge jars for Minecraft 26.1'
    group = 'build'
    commandLine './gradlew', 'build', '-Pmc=26.1'
}

tasks.register('build26_2', Exec) {
    description = 'Builds Fabric and NeoForge jars for Minecraft 26.2'
    group = 'build'
    commandLine './gradlew', 'build', '-Pmc=26.2'
}

tasks.register('build26_3', Exec) {
    description = 'Builds Fabric and NeoForge jars for Minecraft 26.3'
    group = 'build'
    commandLine './gradlew', 'build', '-Pmc=26.3'
}

tasks.register('buildAll') {
    description = 'Builds Fabric and NeoForge jars for all supported 26.x versions (26.1, 26.2, 26.3)'
    group = 'build'
    dependsOn 'build26_1', 'build26_2', 'build26_3'
}

tasks.register('smokeTest') {
    description = 'Automated client smoke test: boots each version, confirms clean initialization & audio engine, then shuts down.'
    group = 'verification'
    dependsOn 'buildAll'

    doLast {
        def versionsToTest = ['26.1', '26.2', '26.3']
        println "\n=============================================="
        println "  RUNNING AUTOMATED CLIENT SMOKE TESTS"
        println "==============================================\n"

        versionsToTest.each { mcVer ->
            println "\n>>> Testing Minecraft ${mcVer} (Fabric)..."
            long startTime = System.currentTimeMillis()

            def cmd = ['./gradlew', ':fabric:runClient', "-Pmc=${mcVer}".toString(), '--no-daemon'] as String[]
            def pb = new ProcessBuilder(cmd)
            pb.directory(project.rootDir)
            pb.redirectErrorStream(true)

            def proc = pb.start()
            def reader = new BufferedReader(new InputStreamReader(proc.inputStream))

            boolean passed = false
            String failureReason = null
            String line

            while ((line = reader.readLine()) != null) {
                if (line.contains("MixinApplyError") ||
                    line.contains("Incompatible mod set") ||
                    line.contains("NoSuchMethodError") ||
                    line.contains("ClassNotFoundException") ||
                    line.contains("Exception in thread \"main\"")) {
                    failureReason = line
                    break
                }
                if (line.contains("Sound engine started") || line.contains("OpenAL initialized")) {
                    passed = true
                    break
                }
            }

            if (!passed && failureReason == null) {
                failureReason = "Process terminated before reaching title screen."
            }

            proc.toHandle().descendants().forEach { h -> h.destroyForcibly() }
            proc.destroyForcibly()
            proc.waitFor()

            long elapsed = (System.currentTimeMillis() - startTime) / 1000
            if (passed) {
                println "✔ [PASSED] Minecraft ${mcVer} loaded cleanly in ${elapsed}s (Mixins applied, mod loaded, title screen reached)!"
            } else {
                throw new GradleException("✘ [FAILED] Minecraft ${mcVer} smoke test failed: ${failureReason}")
            }
        }

        println "\n=============================================="
        println "  ALL VERSIONS PASSED SMOKE TESTS SUCCESSFULLY"
        println "==============================================\n"
    }
}
