plugins {
    id 'net.fabricmc.fabric-loom'
}

loom {
    runs {
        clientGameTest {
            client()
            name "Client Game Test"
            vmArg "-Dfabric.client.gametest"
            runDir "run-client-gametest"
            source sourceSets.test
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    implementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}"
    implementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    implementation project(":common")
}

processResources {
    def expandProps = [
        "version": project.version,
        "loader_version": rootProject.loader_version,
        "minecraft_version": rootProject.minecraft_version
    ]
    inputs.properties expandProps

    filesMatching("fabric.mod.json") {
        expand expandProps
    }

    from project(":common").sourceSets.main.resources
}

tasks.named('jar', Jar).configure {
    from project(":common").sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}
