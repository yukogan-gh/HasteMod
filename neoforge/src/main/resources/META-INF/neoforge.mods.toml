modLoader="javafml"
loaderVersion="[2,)"
license="MIT"
issueTrackerURL="https://github.com/YukoganDev/HasteMod/issues"

[[mods]]
modId="hastemod"
version="${version}"
displayName="HasteMod"
description='''
A client-side mod that abuses the instamine feature to very quickly mine set types of blocks.
'''
authors="Yukogan"
displayURL="https://github.com/YukoganDev/HasteMod"
logoFile="assets/hastemod/icon.png"
logoBlur=false
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="hastemod.mixins.json"

[[dependencies.hastemod]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.hastemod]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.hastemod]]
modId="yet_another_config_lib_v3"
type="optional"
versionRange="[3.0.0,)"
ordering="NONE"
side="CLIENT"
